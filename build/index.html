    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/favicon-32x32.png" />
    <script src="js/main.js" type="module"></script>
    <title>front-end mentor's weather app challenge</title>
  </head>
  <body
    class="bg-BGCOLOR text-white p-4 w-full min-h-screen h-fit text-FS font-FONT-FAM md:p-8"

    <header class="flex justify-between items-start max-w-322 mx-auto">
      <img
        src="images/logo.svg"
        alt="Weather Now Logo"
        width="197"
        height="40"
      />
      <div class="flex items-end flex-col relative">
        <button
          class="flex bg-CONTAINER-BGCOLOR border border-BORDER-COLOR w-30 justify-evenly items-center hover:cursor-pointer rounded-lg focus:outline-1 focus:outline-white min-w-12 min-h-12"
          id="toggleUnit"
          aria-label="toogle between imperial and metric units"
          title="Units Toogle"
        >
          <img src="images/icon-units.svg" alt="" class="shrink w-4 h-4" />
          <span>Units</span>
          <img
            src="images/icon-dropdown.svg"
            data-dropDown="true"
            alt=""
            class="shrink w-3.25 h-2"
          />
        </button>

        <div
          class="units-drop-down hidden"
          id="unitsDropDown"
          aria-expanded="false"
        >
          <button class="switchBtn" data-name="imperialBtn">
            Switch to imperial
          </button>
          <button class="switchBtn" data-name="metricBtn">
            Switch to metric
          </button>
          <div class="header">Temperature</div>
          <button class="unit" data-name="°CBtn">Celsuis (°C)</button>
          <button class="unit" data-name="°FBtn">
            Fahrenheit (F)
            <img src="images/icon-checkmark.svg" alt="" />
          </button>
          <div class="header">Wind Speed</div>
          <button class="unit" data-name="km/hBtn">km/h</button>
          <button class="unit" data-name="mphBtn">mph</button>
          <div class="header">Percipitation</div>
          <button class="unit" data-name="mmBtn">Millimeters (mm)</button>
          <button class="unit" data-name="inchBtn">Inches (in)</button>
        </div>
      </div>
    </header>
    <main class="flex justify-center items-center flex-col">
      <h1 class="absolute -left-10000">
        Front End Mentor's Intermediate Weather App Challenge
      </h1>
      <p class="text-6xl my-12 text-center font-HEADER-FONT">
        How's the Sky Looking today?
      </p>
      <section class="w-full">
        <form
          role="search"
          class="flex flex-wrap flex-row mx-auto gap-4 w-[min(100%,600px)] lg:w-175"
          id="searchForm"
        >
          <div
            class="bg-CONTAINER-BGCOLOR border border-BORDER-COLOR rounded-lg flex items-center 570:grow px-4 w-[min(100%,400px)] lg:w-135 min-h-48px focus-within:outline-white focus-within:outline-1"
            tabindex="1"
          >
            <img
              src="images/icon-search.svg"
              class="w-5.25 h-5.25 mr-2"
              alt="search icon"
            />
            <label for="searchInput" class="absolute -left-10000"
              >Search Weather Conditions For Any Location</label
            >
            <input
              type="search"
              placeholder="Search for a place..."
              class="w-[calc(100%-45px)] py-3 focus:outline-none hover:cursor-pointer"
              id="searchInput"
              autocomplete="off"
            />
          </div>

          <button
            class="bg-SEARCH-BTN-COLOR py-2 px-4 570:grow hover:cursor-pointer rounded-lg w-30 min-w-12 min-h-12 focus:outline-white focus:outline-1"
            aria-label="submit location search"
            title="Search Button"
            type="submit"
          >
            Search
          </button>
        </form>
      </section>
      <a
        href="#dailyHeader"
        class="absolute top-9999 focus:top-4 focus:left-4 rounded-lg focus:bg-white focus:text-neutral-700 p-2"

                <span>Tuesday</span
