<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <title>front-end mentor's weather app challenge</title>
  </head>
  <body class="bg-blue-900 text-white p-6 w-full min-h-screen text-[1.125rem]">
    <header class="flex justify-between">
      <img
        src="images/logo.svg"
        alt="Weather Now Logo"
        width="197"
        height="40"
      />

      <button
        class="flex bg-black w-25 justify-evenly items-center rounded-lg"
        id="toggleUnit"
        aria-label="toogle between imperial and metric units"
      >
        <img src="images/icon-units.svg" alt="" class="shrink w-4 h-4" />
        <span>Units</span>
        <img src="images/icon-dropdown.svg" alt="" class="shrink w-3.25 h-2" />
      </button>
    </header>
    <main>
      <h1 class="text-4xl my-12 mx-auto w-fit">How's the Sky Looking today?</h1>
      <section>
        <form>
          <div class="bg-black">
            <input type="text" />
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
