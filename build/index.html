<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <title>front-end mentor's weather app challenge</title>
  </head>
  <body
    class="bg-neutral-900 text-white p-6 w-full min-h-screen text-[1.125rem]"
  >
    <header class="flex justify-between">
      <img
        src="images/logo.svg"
        alt="Weather Now Logo"
        width="197"
        height="40"
      />

      <button
        class="flex bg-neutral-700 w-25 justify-evenly items-center rounded-lg"
        id="toggleUnit"
        aria-label="toogle between imperial and metric units"
      >
        <img src="images/icon-units.svg" alt="" class="shrink w-4 h-4" />
        <span>Units</span>
        <img src="images/icon-dropdown.svg" alt="" class="shrink w-3.25 h-2" />
      </button>
    </header>
    <main>
      <h1 class="text-4xl my-12 mx-auto w-fit">How's the Sky Looking today?</h1>
      <section>
        <form class="flex mx-auto w-fit gap-5">
          <div
            class="bg-neutral-700 rounded-lg w-fit flex items-center px-4 py-3"
          >
            <img
              src="images/icon-search.svg"
              class="w-5.25 h-5.25 mr-2"
              alt="search icon"
            />
            <input
              type="text"
              placeholder="Search for a place..."
              class="min-w-[max(280px,60%)]"
            />
          </div>
          <button
            class="bg-blue-900 py-2 px-4 rounded-lg"
            aria-label="submit location search"
            title="search-button"
            tabindex="1"
          >
            Search
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
