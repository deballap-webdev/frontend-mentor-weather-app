<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <title>front-end mentor's weather app challenge</title>
  </head>
  <body
    class="bg-neutral-900 text-white p-4 w-full min-h-screen text-[1.125rem]"
  >
    <header class="flex justify-between">
      <img
        src="images/logo.svg"
        alt="Weather Now Logo"
        width="197"
        height="40"
      />

      <button
        class="flex bg-neutral-900 w-25 justify-evenly items-center rounded-lg"
        id="toggleUnit"
        aria-label="toogle between imperial and metric units"
      >
        <img src="images/icon-units.svg" alt="" class="shrink w-4 h-4" />
        <span>Units</span>
        <img src="images/icon-dropdown.svg" alt="" class="shrink w-3.25 h-2" />
      </button>
    </header>
    <main>
      <h1 class="text-4xl my-12 text-center">How's the Sky Looking today?</h1>
      <section>
        <form class="flex flex-wrap mx-auto gap-5" id="searchForm">
          <div
            class="bg-neutral-700 rounded-lg flex grow items-center px-4 py-3"
          >
            <img
              src="images/icon-search.svg"
              class="w-5.25 h-5.25 mr-2"
              alt="search icon"
            />
            <label for="searchInput" class="absolute -left-10000"
              >Search Weather Conditions For Any Location</label
            >
            <input
              type="text"
              placeholder="Search for a place..."
              class="w-[max(200px,60%)]"
              id="searchInput"
            />
          </div>
          <button
            class="bg-blue-900 py-2 px-4 grow rounded-lg"
            aria-label="submit location search"
            title="search-button"
            tabindex="1"
          >
            Search
          </button>
        </form>
      </section>
      <a href=""></a>

      <section aria-labelledby="currentHeader" class="my-6">
        <h2 id="currentHeader" class="absolute -left-10000">
          Current Weather Conditions
        </h2>
        <section
          class="bg-[url(../images/bg-today-small.svg)] p-4 w-full h-71.5 mb-4 flex flex-col justify-evenly items-center"
          id="currentWeather"
        >
          <div class="font-bold text-3xl">Berlin, Germany</div>
          <div>Tuesday, Aug 5, 2025</div>
          <div class="flex items-center justify-between w-full">
            <img
              src="images/icon-sunny.webp"
              width="100"
              height="100"
              alt="sunny icon"
            />
            <div class="text-7xl italic text-bold">20°</div>
          </div>
        </section>

        <section id="currentDetails" class="flex flex-wrap gap-4">
          <div
            class="bg-neutral-700 border flex flex-col justify-between border-solid border-slate-400 rounded-lg p-6 h-30 w-40"
          >
            <div>Feels Like</div>
            <div class="text-2xl">64°</div>
          </div>
          <div
            class="bg-neutral-700 border flex flex-col justify-between border-solid border-slate-400 rounded-lg p-6 h-30 w-40"
          >
            <div>Humidity</div>
            <div class="text-2xl">46%</div>
          </div>
          <div
            class="bg-neutral-700 border flex flex-col justify-between border-solid border-slate-400 rounded-lg p-6 h-30 w-40"
          >
            <div>Wind</div>
            <div class="text-2xl">9 mph</div>
          </div>
          <div
            class="bg-neutral-700 border flex flex-col justify-between border-solid border-slate-400 rounded-lg p-6 h-30 w-40"
          >
            <div>Percipitation</div>
            <div class="text-2xl">0 in</div>
          </div>
        </section>
      </section>

      <section>
        <h2 class="mb-4">Daily Forecast</h2>
        <div class="flex flex-wrap gap-4">
          <div
            class="w-25 bg-neutral-800 p-2 flex flex-col rounded-lg border border-slate-400 items-center"
          >
            <div>Tue</div>
            <img src="images/icon-drizzle.webp" alt="" class="w-fit" />
            <div class="flex justify-between w-full">
              <div>68°</div>
              <div>57°</div>
            </div>
          </div>
          <div
            class="w-25 bg-neutral-800 p-2 flex flex-col rounded-lg border border-slate-400 items-center"
          >
            <div>Tue</div>
            <img src="images/icon-drizzle.webp" alt="" class="w-fit" />
            <div class="flex justify-between w-full">
              <div>68°</div>

            </div>
          </div>
          <div

          >

            <img src="images/icon-drizzle.webp" alt="" class="w-fit" />
            <div class="flex justify-between w-full">

            <div class="flex justify-between w-full">

            </div>
          </div>
          <div

          >
            <div>Tue</div>
            <img src="images/icon-drizzle.webp" alt="" class="w-fit" />
            <div class="flex justify-between w-full">

            <div class="flex justify-between w-full">
              <div>68°</div>

            </div>
          </div>
          <div

          >
            <div>Tue</div>
            <img src="images/icon-drizzle.webp" alt="" class="w-fit" />

              <div>68°</div>

            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
